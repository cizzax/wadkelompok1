<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="form">
        <h1 class="judul">Formulir Penyewaan Lapangan</h1>
        <div>
            <form>
                <div>
                    <label for="nama" id="data">Boleh tau namanya siapa?</label>
                    <input type="text" id="data">
                </div>
                <div>
                <label for="lapangan" id="jenis">Ingin sewa lapangan apa?</label>
                <select>
                    <option value="Lapangan 1">Lapangan 1</option>
                    <option value="Lapangan 2">Lapangan 2</option>
                    <option value="Lapangan 3">Lapangan 3</option>
                </select>
                </div>
                <div>
                    <label for="pembayaran" id="pay">Bukti pembayaran</label>
                    <input type="file" id="pay">
                </div>
                <div>
                    <button type="button">Submit</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
